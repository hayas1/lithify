[workspace.package]
version = "0.1.0"
description = "Settle the change log of a database into the snapshots and histories of a warehouse"
authors = ["hayas1 <h4ystack@gmail.com>"]
edition = "2024"
repository = "https://github.com/hayas1/lithify"
license-file = "../LICENSE"
readme = "../README.md"

[workspace]
members = [
    "lithify-cli",
    "lithify-e2e",
    "lithify-config",
    "lithify-core",
    "lithify-protocol",
    "lithify-strategy",
]
resolver = "3"

[workspace.dependencies]
lithify-cli = { version = "0.1.0", path = "lithify-cli" }
lithify-config = { version = "0.1.0", path = "lithify-config" }
lithify-core = { version = "0.1.0", path = "lithify-core" }
lithify-protocol = { version = "0.1.0", path = "lithify-protocol" }
lithify-strategy = { version = "0.1.0", path = "lithify-strategy" }

chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive", "env"] }
duckdb = "1.10505.0"
google-cloud-auth = "1.16"
google-cloud-bigquery = "=0.16.1-preview"
google-cloud-gax = "1.14"
mysql = "28.0.2"
semigroup = { version = "0.6.0", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
sqlparser = "0.63"
tokio = { version = "1", features = ["rt"] }
tracing = "0.1"
ulid = "3"
tracing-subscriber = "0.3"
toml = "0.9"
wkt = { package = "google-cloud-wkt", version = "1.7" }
