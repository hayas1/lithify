[workspace.package]
version = "0.1.0"
description = "Settle the change log of a database into the snapshots and histories of a warehouse"
authors = ["hayas1 <h4ystack@gmail.com>"]
edition = "2024"
repository = "https://github.com/hayas1/lithify"
license-file = "../LICENSE"
readme = "../README.md"

[workspace]
members = [
    "lithify-cli",
    "lithify-e2e",
    "lithify-pipeline",
    "lithify-core",
    "lithify-protocol",
    "lithify-artifact",
    "lithify-testing",
    "lithify-ui",
]
resolver = "3"

[workspace.dependencies]
lithify-cli = { version = "0.1.0", path = "lithify-cli" }
lithify-pipeline = { version = "0.1.0", path = "lithify-pipeline" }
lithify-core = { version = "0.1.0", path = "lithify-core" }
lithify-protocol = { version = "0.1.0", path = "lithify-protocol" }
lithify-artifact = { version = "0.1.0", path = "lithify-artifact" }
lithify-testing = { path = "lithify-testing" }
lithify-ui = { version = "0.1.0", path = "lithify-ui" }

axum = "0.8.9"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = { version = "0.9.0", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
duckdb = "1.10505.0"
google-cloud-auth = "1.16"
google-cloud-bigquery = "=0.16.1-preview"
google-cloud-gax = "1.14"
leptos = { version = "0.8.22", features = ["ssr"] }
mysql = "28.0.2"
proptest = "1"
semigroup = { version = "0.6.0", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
serde_urlencoded = "0.7.1"
sqlparser = "0.63"
tokio = { version = "1", features = ["rt"] }
tracing = "0.1"
ulid = "3"
tracing-subscriber = "0.3"
toml = "0.9"
wkt = { package = "google-cloud-wkt", version = "1.7" }
