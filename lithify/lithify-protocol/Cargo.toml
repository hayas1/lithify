[package]
name = "lithify-protocol"
version.workspace = true
description.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true
license-file.workspace = true
readme.workspace = true

[dependencies]
duckdb = { workspace = true, optional = true }
lithify-core = { workspace = true }
google-cloud-auth = { workspace = true, optional = true }
google-cloud-bigquery = { workspace = true, optional = true }
google-cloud-gax = { workspace = true, optional = true }
wkt = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlparser = { workspace = true }
tokio = { workspace = true, optional = true }

[features]
bigquery = [
    "dep:google-cloud-auth",
    "dep:google-cloud-bigquery",
    "dep:google-cloud-gax",
    "dep:wkt",
    "dep:tokio",
]
duckdb = ["dep:duckdb"]
