[package]
name = "event-replay-cli"
version.workspace = true
description.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true
license-file.workspace = true
readme.workspace = true

[lib]
name = "event_replay_cli"
path = "src/lib.rs"

[[bin]]
name = "event-replay"
path = "src/main.rs"

[dependencies]
chrono = { workspace = true }
clap = { workspace = true }
duckdb = { workspace = true }
event-replay-config = { workspace = true }
event-replay-core = { workspace = true }
event-replay-protocol = { workspace = true, features = ["bigquery", "duckdb"] }
google-cloud-bigquery = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
event-replay-strategy = { workspace = true }
toml = { workspace = true }
