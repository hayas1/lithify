[package]
name = "event-replay-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "event-replay"
path = "src/main.rs"

[dependencies]
chrono = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
duckdb = { workspace = true }
event-replay-config = { workspace = true }
event-replay-core = { workspace = true }
event-replay-protocol = { workspace = true, features = ["bigquery", "duckdb"] }
google-cloud-bigquery = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
event-replay-strategy = { workspace = true }
toml = "0.9"
