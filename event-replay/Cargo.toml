[workspace]
members = [
    "event-replay-cli",
    "event-replay-config",
    "event-replay-core",
    "event-replay-protocol",
    "event-replay-strategy",
]
resolver = "3"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
duckdb = "1.10505.0"
event-replay-config = { path = "event-replay-config" }
event-replay-core = { path = "event-replay-core" }
event-replay-protocol = { path = "event-replay-protocol" }
event-replay-strategy = { path = "event-replay-strategy" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
