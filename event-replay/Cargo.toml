[workspace]
members = ["event-replay-config", "event-replay-core", "event-replay-protocol", "event-replay-strategy"]
resolver = "3"

[workspace.dependencies]
event-replay-config = { path = "event-replay-config" }
event-replay-core = { path = "event-replay-core" }
event-replay-strategy = { path = "event-replay-strategy" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
