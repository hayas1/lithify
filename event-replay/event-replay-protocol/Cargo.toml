[package]
name = "event-replay-protocol"
version = "0.1.0"
edition = "2024"

[dependencies]
duckdb = { workspace = true, optional = true }
event-replay-core = { workspace = true }
google-cloud-auth = { workspace = true, optional = true }
google-cloud-bigquery = { workspace = true, optional = true }
google-cloud-gax = { workspace = true, optional = true }
wkt = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, optional = true }

[features]
bigquery = [
    "dep:google-cloud-auth",
    "dep:google-cloud-bigquery",
    "dep:google-cloud-gax",
    "dep:wkt",
    "dep:tokio",
]
duckdb = ["dep:duckdb"]
