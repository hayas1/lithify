[default]
source.capture.debezium.dialect = "mysql"

[[source]]
name = "primary"
since = "1970-01-01T00:00:00Z"
topic_prefix = "mysql"

[[sink]]
name = "bigquery"

[sink.warehouse.bigquery]
project = "local-project"
endpoint = "http://bigquery-emulator:9050"
credentials = "anonymous"
change_log = { dataset = "mysql_shop_cdc" }
place.snapshot = { dataset = "mysql_shop" }
place.instant_0900 = { dataset = "mysql_shop_0900" }
place.instant_1200 = { dataset = "mysql_shop_1200" }
place.instant_1800 = { dataset = "mysql_shop_1800" }
place.scd1 = { dataset = "mysql_shop_scd1" }
place.scd2 = { dataset = "mysql_shop_scd2" }

[[sink]]
name = "duckdb_s3"

[sink.warehouse.duckdb]
s3 = { endpoint = "http://rustfs:9000", region = "us-east-1", bucket = "lithify", format = "parquet" }
change_log = { prefix = "mysql_shop_cdc" }
place.snapshot = { prefix = "mysql_shop" }
place.instant_0900 = { prefix = "mysql_shop_0900" }
place.instant_1200 = { prefix = "mysql_shop_1200" }
place.instant_1800 = { prefix = "mysql_shop_1800" }
place.scd1 = { prefix = "mysql_shop_scd1" }
place.scd2 = { prefix = "mysql_shop_scd2" }
